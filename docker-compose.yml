services:
  config-app:
    build:
      context: ./config-app
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: ghcr.io/${UPDATE_REPO:-your-org/haproxy-dashboard}/config-app:${IMAGE_TAG:-latest}
    container_name: acme-config-app
    environment:
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.example.local}
      - PLATFORM_LANG=${PLATFORM_LANG:-de}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # Brute-force protection on the login (H2)
      - LOGIN_MAX_ATTEMPTS=${LOGIN_MAX_ATTEMPTS:-5}
      - LOGIN_WINDOW=${LOGIN_WINDOW:-300}
      - LOGIN_LOCKOUT=${LOGIN_LOCKOUT:-300}
      # HSTS (N2) - enable only with a real certificate
      - ENABLE_HSTS=${ENABLE_HSTS:-false}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
      # Separate, higher role for system.update (RBAC). Empty = falls back to admin.
      - PLATFORM_ADMIN_USER=${PLATFORM_ADMIN_USER:-}
      - PLATFORM_ADMIN_PASSWORD=${PLATFORM_ADMIN_PASSWORD:-}
      # Platform Connector API (opt-in). Empty = /api/v1/* disabled.
      - CONNECTOR_TOKEN=${CONNECTOR_TOKEN:-}
      # Reap orphaned connector routes after N seconds without heartbeat (0 = off).
      - CONNECTOR_TTL=${CONNECTOR_TTL:-180}
      # #30: optional SSRF allowlist for connector-registered backends. Empty = any
      # valid backend is accepted (the machine token is trusted infrastructure).
      # Set it to restrict registrations to approved hosts/networks, comma- or
      # space-separated: exact host (app1), wildcard suffix (*.internal), IP, CIDR
      # (10.0.0.0/8), optionally port-pinned (app1:8080). Connector API only; the
      # human admin GUI stays unrestricted.
      - CONNECTOR_BACKEND_ALLOWLIST=${CONNECTOR_BACKEND_ALLOWLIST:-}
      - CONFIG_DIR=/app/config
      - HAPROXY_OUT=/app/haproxy_out
      - UPDATE_DIR=/app/update
      # E4: directory holding health-check header secrets (read at render time).
      - HC_SECRET_DIR=${HC_SECRET_DIR:-/app/config/secrets}
      # E6: optional syslog target for HAProxy (e.g. 10.0.0.5:514 or /dev/log).
      # Empty = file logging only. Rendered into the generated config.
      - SYSLOG_ADDRESS=${SYSLOG_ADDRESS:-}
      # #23: real client IP behind a proxy/tunnel. Only when the connection comes
      # from a TRUSTED_PROXIES network is the client IP taken from REAL_IP_HEADER
      # (e.g. CF-Connecting-IP). Both empty = off (no header is trusted).
      - REAL_IP_HEADER=${REAL_IP_HEADER:-}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # #24: frontend mode. "https" (default) = :80 redirects to :443, TLS on :443.
      # "http" = TLS terminates upstream (e.g. a Cloudflare Tunnel) -> route directly
      # on :80, no redirect. Then publish :80 (not :443) to the tunnel.
      - FRONTEND_MODE=${FRONTEND_MODE:-https}
      # APP_VERSION is NOT set here - it is baked into the image (build arg),
      # so a pulled GHCR image reports its real release version.
      - UPDATE_REPO=${UPDATE_REPO:-your-org/haproxy-dashboard}
      - UPDATE_TOKEN=${UPDATE_TOKEN:-}
      - UPDATE_MODE=${UPDATE_MODE:-manual}
      # Display only in the admin GUI (the schedule itself runs host-side as a systemd timer)
      - AUTO_UPDATE=${AUTO_UPDATE:-false}
      - AUTO_UPDATE_SCHEDULE=${AUTO_UPDATE_SCHEDULE:-}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      # services.yaml + theme (viewable/editable on the host)
      - ./data/config:/app/config
      # generated haproxy.cfg (shared with the haproxy container)
      - ./data/haproxy:/app/haproxy_out
      # #27: host platform certificate (certs/) read-only, so the admin GUI can show
      # its metadata/expiry even when it is not managed in the GUI. A GUI-uploaded
      # platform cert is stored under ./data/config/certs/ (shared with haproxy).
      - ./certs:/app/platform-certs:ro
      # update request/result/audit - host bind so the HOST-side updater
      # (systemd) can read the request. config-app ONLY writes a request here;
      # it has NO Docker socket and never runs Docker.
      - ./data/update:/app/update
    # NO Docker socket - deliberately. Privileged actions run exclusively in the
    # host-side updater, outside the container trust boundary.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # M1 + #25: container hardening. Runs as a fixed non-root UID (USER 1000 in the
    # image), needs no Linux capabilities, and the root FS is read-only (writes only
    # into the mounted volumes + /tmp). The bind-mounts below must be owned by uid
    # 1000 on the host (the updater/install script and README cover this).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - platform
    restart: unless-stopped

  haproxy:
    build: ./haproxy
    image: ghcr.io/${UPDATE_REPO:-your-org/haproxy-dashboard}/haproxy:${IMAGE_TAG:-latest}
    container_name: acme-haproxy
    depends_on:
      - config-app
    environment:
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-platform.example.local}
      # E6: log retention in the in-container log file (longer history).
      - LOG_ROTATE_AT=${LOG_ROTATE_AT:-5000}
      - LOG_KEEP_LINES=${LOG_KEEP_LINES:-600}
    ports:
      - "80:80"
      - "443:443"
      # E3: TCP streams need their listen ports published. Put them in
      # docker-compose.override.yml (copy docker-compose.override.yml.example) so
      # they survive updates - NOT here. The admin GUI shows the exact lines.
    volumes:
      # place your .crt + .key here (read-only)
      - ./certs:/certs:ro
      # additional SNI certificates uploaded via the admin GUI (read-only)
      - ./data/config/certs:/certs-extra:ro
      # shared generated config
      - ./data/haproxy:/etc/haproxy/dynamic
      # Internal CA (opt-in, `--profile ca`): PUBLIC certs only (root/intermediate),
      # so HAProxy can verify backend certs issued by the internal step-ca. The CA
      # private keys live under data/step-ca/secrets and are NOT mounted here.
      # Empty when the CA profile is unused.
      - ./data/step-ca/certs:/certs-ca:ro
      # #21: trusted backend CAs uploaded in the admin GUI (public certs only) -
      # HAProxy verifies backends with backend_ca=custom against this bundle.
      - ./data/config/ca:/certs-trust:ro
    # Lets you reach backends via a host-published port: enter the backend in the
    # GUI as "host.docker.internal:PORT". (Automatic on Docker Desktop; on Linux
    # this entry provides the required host-gateway resolution.)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # M1 + #25: hardening. HAProxy runs as a fixed non-root UID (USER 1000 in the
    # image) with ALL capabilities dropped. Instead of NET_BIND_SERVICE it binds the
    # low ports 80/443 (and any TCP-stream port) via this per-container sysctl, which
    # only affects this container's own network namespace (safe, not privileged).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    networks:
      - platform
    restart: unless-stopped

  # Internal certificate authority (opt-in). Start it with:
  #     docker compose --profile ca up -d
  # On first start it auto-initializes a root + intermediate CA and an ACME
  # provisioner (step-ca). Backends obtain short-lived certs from it and HAProxy
  # verifies them against the internal root (mounted read-only above). Without the
  # "ca" profile this service never runs and the platform behaves exactly as before.
  step-ca:
    image: smallstep/step-ca:0.28.1
    container_name: acme-step-ca
    profiles: ["ca"]
    environment:
      DOCKER_STEPCA_INIT_NAME: "${CA_NAME:-Acme Internal CA}"
      DOCKER_STEPCA_INIT_DNS_NAMES: "${CA_DNS_NAMES:-step-ca,localhost}"
      DOCKER_STEPCA_INIT_ACME: "true"
      DOCKER_STEPCA_INIT_REMOTE_MANAGEMENT: "false"
      # CA key password. Set STEPCA_PASSWORD in .env BEFORE the first start.
      DOCKER_STEPCA_INIT_PASSWORD: "${STEPCA_PASSWORD:-}"
    volumes:
      # CA config + certs + ENCRYPTED private keys (host-only; never in git - data/ is ignored).
      - ./data/step-ca:/home/step
    # M1: hardening consistent with the rest of the stack.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # #36: the step-ca binary carries a file capability (cap_net_bind_service=eip).
    # With cap_drop ALL + no-new-privileges the kernel refuses to exec it ("Operation
    # not permitted", restart loop). Port 9000 does not need it, but the file
    # capability is enforced on exec, so this single cap must be back in the bounding
    # set. Everything else stays dropped.
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - platform
    restart: unless-stopped

# Shared network. Your application containers can join this network, then HAProxy
# reaches them by container name (e.g. abfallmanager:8080). Alternatively, just
# enter host:port / ip:port per tile.
networks:
  platform:
    name: acme-platform
    driver: bridge
