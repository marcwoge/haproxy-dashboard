# ============================================================
#  Opt-in (M4): Login-Daten via Docker *secrets* statt Klartext in .env.
#
#  Secrets liegen als Dateien vor und werden dem Container unter /run/secrets
#  bereitgestellt (tmpfs, nicht in `docker inspect`/Env sichtbar).
#
#  Nutzung:
#    1) Secret-Dateien anlegen (Verzeichnis ist gitignored):
#         mkdir -p secrets
#         python -c "import secrets;print(secrets.token_urlsafe(24))" > secrets/admin_password
#         python -c "import secrets;print(secrets.token_hex(32))"     > secrets/flask_secret_key
#         chmod 600 secrets/*
#    2) In .env ADMIN_PASSWORD LEER lassen (der Wert kommt aus dem Secret).
#    3) Mit beiden Compose-Dateien starten:
#         docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# ============================================================
services:
  config-app:
    environment:
      # <NAME>_FILE hat Vorrang vor <NAME> aus der Env.
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - SECRET_KEY_FILE=/run/secrets/flask_secret_key
      # Optional, falls genutzt:
      # - PLATFORM_ADMIN_PASSWORD_FILE=/run/secrets/platform_admin_password
      # - UPDATE_TOKEN_FILE=/run/secrets/update_token
    secrets:
      - admin_password
      - flask_secret_key
      # - platform_admin_password
      # - update_token

secrets:
  admin_password:
    file: ./secrets/admin_password
  flask_secret_key:
    file: ./secrets/flask_secret_key
  # platform_admin_password:
  #   file: ./secrets/platform_admin_password
  # update_token:
  #   file: ./secrets/update_token
