# ============================================================
#  Opt-in (M4): login data via Docker *secrets* instead of plain text in .env.
#
#  Secrets are provided as files and mounted into the container under
#  /run/secrets (tmpfs, not visible in `docker inspect`/env).
#
#  Usage:
#    1) Create the secret files (the directory is gitignored):
#         mkdir -p secrets
#         python -c "import secrets;print(secrets.token_urlsafe(24))" > secrets/admin_password
#         python -c "import secrets;print(secrets.token_hex(32))"     > secrets/flask_secret_key
#         chmod 600 secrets/*
#    2) Leave ADMIN_PASSWORD EMPTY in .env (the value comes from the secret).
#    3) Start with both compose files:
#         docker compose -f docker-compose.yml -f docker-compose.secrets.yml up -d
# ============================================================
services:
  config-app:
    environment:
      # <NAME>_FILE takes precedence over <NAME> from the env.
      - ADMIN_PASSWORD_FILE=/run/secrets/admin_password
      - SECRET_KEY_FILE=/run/secrets/flask_secret_key
      # Optional, if used:
      # - PLATFORM_ADMIN_PASSWORD_FILE=/run/secrets/platform_admin_password
      # - UPDATE_TOKEN_FILE=/run/secrets/update_token
    secrets:
      - admin_password
      - flask_secret_key
      # - platform_admin_password
      # - update_token

secrets:
  admin_password:
    file: ./secrets/admin_password
  flask_secret_key:
    file: ./secrets/flask_secret_key
  # platform_admin_password:
  #   file: ./secrets/platform_admin_password
  # update_token:
  #   file: ./secrets/update_token
