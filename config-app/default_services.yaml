# ============================================================
#  Acme Platform - service and theme configuration
#  Copied to ./data/config/services.yaml on first start.
#  Editable via the admin GUI (/admin) OR directly here.
# ============================================================
domain: platform.example.local
language: de                  # UI language (de, en, ...) - see config-app/lang/

# Optional alias domains that 301-redirect to a platform path (admin GUI
# "Domains & certificates"; path + query are preserved). Additional TLS
# certificates (SNI) are uploaded in the GUI and stored under data/config/certs/.
# domain_aliases:
#   - {host: wiki.example.local, redirect_to: /wiki, keep_path: true}
#   - {host: forms.example.local, redirect_to: /forms}
# E5: "root_to" redirects a bare "/" on the alias domain to its own target,
#     independent of path preservation for the rest of the domain, e.g.:
#   - {host: app.example.local, redirect_to: /app, keep_path: true, root_to: /app/home}

theme:
  title: "Acme Platform"
  subtitle: "Service Dashboard"
  background: "#0f172a"      # page background (top)
  background2: "#1e293b"     # page background (bottom, gradient)
  tile_color: "#1e293b"      # default tile color
  tile_text: "#f1f5f9"       # text color on tiles
  accent: "#38bdf8"          # accent color (title, borders)
  columns: 4                 # number of tiles per row (max.)
  logo: ""                   # file name in the config folder (upload via GUI)
  logo_height: 64            # display height of the logo in pixels
  show_status: true          # show backend status (UP/DOWN) on the dashboard

# Notifications (email/webhook) - easiest to configure in the admin GUI.
notifications:
  enabled: false
  email_mode: smtp           # smtp (relay via host) | direct (self-delivery via MX)
  from_addr: ""
  to_addrs: ""               # comma-separated recipients
  smtp_host: ""
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  smtp_security: starttls    # starttls | ssl | none
  webhook_url: ""
  events:
    update_available: true
    update_result: true
    backend_down: true

services:
  - name: "Example Service"
    path: "/example"
    backend: "example-app:8080"     # container-name:port  OR  host:port / ip:port
    scheme: "http"                  # http | https (how HAProxy talks to the backend)
    ssl_verify: false               # only relevant for scheme=https
    strip_path: false               # strip /example before forwarding?
    icon: "📦"
    color: "#22c55e"                # optional tile color (empty = default)
    description: "Example application (adjust in the admin GUI)"
    enabled: true
    # Optional per-service routing (see the admin GUI section "Advanced"):
    # timeout_server: 600s            # long uploads/exports (default: global 60s)
    # timeout_tunnel: 1h              # WebSocket / long-polling
    # deny_paths: [/admin, /setup]    # sub-paths (relative to path) -> 403
    # E1 - several backends + load balancing (overrides "backend" above):
    # servers: ["10.0.0.11:8080", "10.0.0.12:8080"]
    # balance: roundrobin             # roundrobin (default) | leastconn (>= 2 servers)
    # E2 - path matching and extra paths routed to the same backend:
    # match: exact                    # exact (default) | prefix (path_beg, no trailing /)
    # extra_paths: [/api, /static]    # additional paths, no separate dashboard tile
    # E5 - keep the route but hide the dashboard tile:
    # hidden: false
    # healthcheck:                    # HTTP health check instead of a plain TCP check
    #   uri: /health                  #   default: the service path
    #   expect_status: "200|301|302"  #   default: any 2xx/3xx
    #   interval: 10s
    #   header_name: Authorization    # E4 - optional health-check header; its value
    #   header_file: hc-token         #   is read from data/config/secrets/<file>
    #                                 #   at render time (never stored in this file)

# E3 - TCP streams (mode tcp) on dedicated ports, managed in the admin GUI under
# "TCP streams". Each listen port must also be published for the haproxy service
# in docker-compose.yml (the GUI shows the exact lines).
# tcp_streams:
#   - name: "Postgres"
#     port: 5432                      # listen port (1-65535, not 80/443/8404)
#     backend: "db:5432"              # single target  OR  use "servers" below
#     # servers: ["db1:5432", "db2:5432"]   # several targets -> load balancing
#     # balance: leastconn            # leastconn (default) | roundrobin (>= 2 servers)
#     tls: false                      # true = TLS termination with the platform cert
#     clitcpka: false                 # TCP keepalive towards the client
#     # timeout_client: 1h            # default 1h (long-lived TCP connections)
#     # timeout_server: 1h
#     enabled: true
