# ============================================================
#  Acme Platform - Service- und Theme-Konfiguration
#  Wird beim ersten Start nach ./data/config/services.yaml kopiert.
#  Editierbar ueber das Admin-GUI (/admin) ODER direkt hier.
# ============================================================
domain: platform.example.local

theme:
  title: "Acme Platform"
  subtitle: "Service Dashboard"
  background: "#0f172a"      # Seitenhintergrund (oben)
  background2: "#1e293b"     # Seitenhintergrund (unten, Verlauf)
  tile_color: "#1e293b"      # Standard-Kachelfarbe
  tile_text: "#f1f5f9"       # Textfarbe auf Kacheln
  accent: "#38bdf8"          # Akzentfarbe (Titel, Rahmen)
  columns: 4                 # Anzahl Kacheln pro Reihe (max.)
  logo: ""                   # Dateiname im config-Ordner (per GUI hochladen)
  logo_height: 64            # Anzeigehoehe des Logos in Pixeln

services:
  - name: "Example Service"
    path: "/example"
    backend: "example-app:8080"     # Container-Name:Port  ODER  host:port / ip:port
    scheme: "http"                  # http | https (wie HAProxy mit dem Backend spricht)
    ssl_verify: false               # nur bei scheme=https relevant
    strip_path: false               # /example vor Weiterleitung entfernen?
    icon: "📦"
    color: "#22c55e"                # optionale Kachelfarbe (leer = Standard)
    description: "Beispiel-Anwendung (im Admin-GUI anpassen)"
    enabled: true
